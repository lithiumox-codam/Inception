[www]
; User and Group for FPM processes
; Using 'nobody' as it's the standard non-root user in Alpine PHP packages
; and matches the user you set for WP_PATH ownership.
user = nobody
group = nobody

; Listen Address
; Listen on all network interfaces (0.0.0.0) inside the container on port 9000
; so that the Nginx container can connect to it via the Docker network.
listen = 0.0.0.0:9000

; Process Manager Settings
pm = dynamic
pm.max_children = 5      ; Max number of concurrent PHP processes
pm.start_servers = 2     ; Number of processes started when FPM launches
pm.min_spare_servers = 1 ; Minimum number of idle processes waiting for requests
pm.max_spare_servers = 3 ; Maximum number of idle processes allowed
; pm.max_requests = 500    ; Optional: Restart a process after X requests (good for memory leaks)

; Logging Configuration for Docker Compatibility
; Ensure PHP-FPM worker errors (like PHP notices/warnings/errors)
; are sent to the main FPM error log stream.
catch_workers_output = yes

; Send PHP's error log output to stderr so 'docker logs' can capture it.
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

; Send this pool's access log to stdout (optional, Nginx usually handles access logs).
; If you only want Nginx access logs, you can comment this out or set it to /dev/null.
access.log = /dev/stdout

; Environment Variables
; Recommended for Docker: Prevent FPM from clearing environment variables
; so variables passed via 'docker run -e' or docker-compose are available to PHP.
clear_env = no

; Optional: You can override php.ini settings here if needed
; php_admin_value[memory_limit] = 256M
; php_admin_value[upload_max_filesize] = 64M
; php_admin_value[post_max_size] = 64M
