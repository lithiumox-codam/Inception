# ./conf/nginx.conf

user nginx;
# Use 'auto' or set explicitly based on your server's cores
worker_processes auto;
pid /var/run/nginx.pid;

# Load dynamic modules if needed (like the SSL module, though often built-in)
# load_module modules/ngx_http_ssl_module.so;

events {
    # Adjust based on expected load and ulimit settings
    worker_connections 1024;
    # Accept multiple connections at once if supported
    multi_accept on;
}

http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    # Adjust keepalive timeout as needed
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # Hide Nginx version for security
    server_tokens off;

    # Default MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging - Redirect to Docker logs
    access_log /dev/stdout;
    error_log /dev/stderr warn; # Log warnings and errors

    # Gzip Compression Settings (Optional but recommended)
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Max upload size (adjust as needed for WordPress)
    client_max_body_size 64M;

    # Default SSL settings (can be overridden in server blocks)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # Consider adding strong ssl_ciphers here

    # <<< CRITICAL PART >>>
    # Include server block configurations from conf.d
    # This MUST be inside the http block.
    include /etc/nginx/conf.d/*.conf;
}